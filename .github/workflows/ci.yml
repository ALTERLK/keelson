name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    # Windows is the primary platform (shell, encodings, line endings);
    # Ubuntu keeps the core honest about not depending on Windows.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,bench,web]"
      - name: Lint
        run: ruff check .
      - name: Test
        # No API key in CI — every model call is mocked; ToolHop tasks that
        # need the (git-ignored) dataset self-skip.
        run: pytest -q
      - name: Static demo builds
        run: python scripts/build_pages.py
      - name: Diagrams are up to date
        run: python scripts/build_diagrams.py --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t keelson:ci .
      - name: CLI starts
        run: docker run --rm keelson:ci --help
      - name: Console answers in replay mode
        run: |
          docker run -d --name console -p 127.0.0.1:8765:8765 keelson:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/api/state > state.json; then break; fi
            sleep 1
          done
          cat state.json
          grep -q '"live":false' state.json
          curl -fsS http://127.0.0.1:8765/api/traces | grep -q '"tool_calls"'
          docker rm -f console
