<rect class="canvas" x="0.5" y="0.5" width="1039" height="959" rx="14"/>
<text class="h1" x="30" y="42">One turn, start to finish</text>
<text class="h2" x="30" y="63">Every tool call passes the gate before it runs. A refusal is a result too: the model sees why and changes course.</text>
