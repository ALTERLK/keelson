<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 770" width="1040" height="770" role="img" aria-label="一条事件流，三个消费者">
<title>一条事件流，三个消费者</title>
<style>svg{--canvas:#ffffff;--frame:#d8dee4;--panel:#f6f8fa;--line:#d0d7de;--group:#afb8c1;--text:#1f2328;--muted:#59636e;--edge:#6e7781;--brand:#9a6700;--brand-bg:#fff8e6;--blue:#0969da;--blue-bg:#eef6ff;--ok:#1a7f37;--ok-bg:#eefbf1;--bad:#cf222e;--bad-bg:#fff1f0;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif}@media (prefers-color-scheme: dark){svg{--canvas:#0d1117;--frame:#30363d;--panel:#161b22;--line:#30363d;--group:#484f58;--text:#e6edf3;--muted:#9198a1;--edge:#7d8590;--brand:#f6c177;--brand-bg:#2a2113;--blue:#58a6ff;--blue-bg:#0f1e33;--ok:#3fb950;--ok-bg:#0f2417;--bad:#f85149;--bad-bg:#2d1214;}}.canvas{fill:var(--canvas);stroke:var(--frame)}.h1{font-size:19px;font-weight:650;fill:var(--text)}.h2{font-size:12.5px;fill:var(--muted)}.group{fill:none;stroke:var(--group);stroke-dasharray:4 4}.group-label{font-size:10.5px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}.box{fill:var(--panel);stroke:var(--line)}.bar{fill:var(--group)}.title{font-size:13.5px;font-weight:620;fill:var(--text)}.sub{font-size:11.5px;fill:var(--muted)}.code{font-size:10.5px;font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;fill:var(--muted)}.edge{fill:none;stroke:var(--edge);stroke-width:1.5}.edge.dashed{stroke-dasharray:5 4}.head{fill:var(--edge)}.label{font-size:11px;fill:var(--muted)}.label-bg{fill:var(--canvas)}.note{font-size:12px;fill:var(--muted)}.note-strong{font-size:12.5px;font-weight:620;fill:var(--text)}.track{fill:var(--panel);stroke:var(--line)}.fill-1{fill:var(--blue);opacity:.55}.fill-2{fill:var(--brand);opacity:.7}.fill-3{fill:var(--bad);opacity:.6}.tick{stroke:var(--text);stroke-width:1.5}.edge.brand{stroke:var(--brand)}.head.brand{fill:var(--brand)}.label.brand{fill:var(--brand)}.node.brand .bar{fill:var(--brand)}.node.brand .box{fill:var(--brand-bg);stroke:var(--brand)}.edge.blue{stroke:var(--blue)}.head.blue{fill:var(--blue)}.label.blue{fill:var(--blue)}.node.blue .bar{fill:var(--blue)}.node.blue .box{fill:var(--blue-bg);stroke:var(--blue)}.edge.ok{stroke:var(--ok)}.head.ok{fill:var(--ok)}.label.ok{fill:var(--ok)}.node.ok .bar{fill:var(--ok)}.node.ok .box{fill:var(--ok-bg);stroke:var(--ok)}.edge.bad{stroke:var(--bad)}.head.bad{fill:var(--bad)}.label.bad{fill:var(--bad)}.node.bad .bar{fill:var(--bad)}.node.bad .box{fill:var(--bad-bg);stroke:var(--bad)}</style>
<defs><marker id="head-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head plain" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="tail-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head plain" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="head-brand" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head brand" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="tail-brand" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head brand" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="head-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="tail-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="head-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="tail-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="head-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="tail-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0.8 L9,5 L0,9.2 z"/></marker></defs>
<rect class="canvas" x="0.5" y="0.5" width="1039" height="769" rx="14"/>
<text class="h1" x="30" y="42">一条事件流，三个消费者</text>
<text class="h2" x="30" y="63">运行时自己不打印，只发布事件；终端、浏览器和录制器各自订阅。回放就是把同一批事件再喂一遍。</text>
<rect class="group" x="350" y="462" width="660" height="278" rx="14"/>
<text class="group-label" x="364" y="482">浏览器里</text>
<path class="edge plain" d="M185.0,154.0 L185.0,206.0" marker-end="url(#head-plain)"/>
<path class="edge plain" d="M520.0,154.0 L520.0,206.0" marker-end="url(#head-plain)"/>
<path class="edge plain" d="M855.0,154.0 L855.0,206.0" marker-end="url(#head-plain)"/>
<path class="edge brand" d="M185.0,310.0 L185.0,366.0" marker-end="url(#head-brand)"/>
<path class="edge brand" d="M520.0,310.0 L520.0,366.0" marker-end="url(#head-brand)"/>
<path class="edge brand" d="M855.0,310.0 L855.0,366.0" marker-end="url(#head-brand)"/>
<path class="edge plain" d="M185.0,430.0 L185.0,492.0" marker-end="url(#head-plain)"/>
<path class="edge plain" d="M520.0,430.0 L520.0,492.0" marker-end="url(#head-plain)"/>
<path class="edge plain dashed" d="M855.0,430.0 L855.0,492.0" marker-end="url(#head-plain)"/>
<path class="edge plain" d="M520.0,556.0 L520.0,592.0" marker-end="url(#head-plain)"/>
<path class="edge plain" d="M855.0,556.0 L855.0,592.0" marker-end="url(#head-plain)"/>
<path class="edge plain" d="M687.5,650.0 L687.5,678.0" marker-end="url(#head-plain)"/>
<g class="node blue"><rect class="box" x="30" y="92" width="310" height="62" rx="9"/><rect class="bar" x="30" y="101" width="3.5" height="44" rx="1.75"/><text class="title" x="46" y="121.5">Agent 循环</text><text class="code" x="46" y="140.5">user_message · assistant_delta · usage · span</text></g>
<g class="node blue"><rect class="box" x="365" y="92" width="310" height="62" rx="9"/><rect class="bar" x="365" y="101" width="3.5" height="44" rx="1.75"/><text class="title" x="381" y="121.5">工具与权限门</text><text class="code" x="381" y="140.5">tool_call · permission · tool_output · tool_result</text></g>
<g class="node blue"><rect class="box" x="700" y="92" width="310" height="62" rx="9"/><rect class="bar" x="700" y="101" width="3.5" height="44" rx="1.75"/><text class="title" x="716" y="121.5">会话</text><text class="code" x="716" y="140.5">session · confirm_request · confirm_resolved</text></g>
<g class="node brand"><rect class="box" x="30" y="206" width="980" height="104" rx="9"/><rect class="bar" x="30" y="215" width="3.5" height="86" rx="1.75"/><text class="title" x="46" y="233.2">EventBus</text><text class="sub" x="46" y="251.2">同步投递，严格按发布顺序 · 每个事件带一个序号 · 订阅者抛异常不会影响运行</text><text class="sub" x="46" y="266.8">保留最近 5000 个事件：晚加入或断线重连的页面，从它见过的最后一个序号接着追</text><text class="sub" x="46" y="282.2">当前总线是一个 ContextVar：一轮对话及其派生的所有任务，都发布到自己会话的总线上</text><text class="code" x="46" y="298.8">agents/events.py</text></g>
<g class="node plain"><rect class="box" x="30" y="366" width="310" height="64" rx="9"/><rect class="bar" x="30" y="375" width="3.5" height="46" rx="1.75"/><text class="title" x="46" y="388.8">终端渲染器</text><text class="sub" x="46" y="406.8">REPL 的显示</text><text class="code" x="46" y="423.2">agents/ui.py</text></g>
<g class="node plain"><rect class="box" x="365" y="366" width="310" height="64" rx="9"/><rect class="bar" x="365" y="375" width="3.5" height="46" rx="1.75"/><text class="title" x="381" y="388.8">SSE 接口</text><text class="sub" x="381" y="406.8">每个会话一条流</text><text class="code" x="381" y="423.2">GET /api/sessions/{id}/events</text></g>
<g class="node plain"><rect class="box" x="700" y="366" width="310" height="64" rx="9"/><rect class="bar" x="700" y="375" width="3.5" height="46" rx="1.75"/><text class="title" x="716" y="388.8">轨迹录制器</text><text class="sub" x="716" y="406.8">把每个事件追加到文件</text><text class="code" x="716" y="423.2">agents/web/recorder.py</text></g>
<g class="node plain"><rect class="box" x="365" y="492" width="310" height="64" rx="9"/><rect class="bar" x="365" y="501" width="3.5" height="46" rx="1.75"/><text class="title" x="381" y="514.8">LiveStream</text><text class="sub" x="381" y="532.8">EventSource；用 Last-Event-ID 续传</text><text class="code" x="381" y="549.2">js/stream.js</text></g>
<g class="node plain"><rect class="box" x="700" y="492" width="310" height="64" rx="9"/><rect class="bar" x="700" y="501" width="3.5" height="46" rx="1.75"/><text class="title" x="716" y="514.8">ReplayPlayer</text><text class="sub" x="716" y="532.8">按原始时间节奏播放轨迹</text><text class="code" x="716" y="549.2">js/stream.js</text></g>
<g class="node brand"><rect class="box" x="365" y="592" width="645" height="58" rx="9"/><rect class="bar" x="365" y="601" width="3.5" height="40" rx="1.75"/><text class="title" x="381" y="619.5">同一个 reducer：state = apply(state, event)</text><text class="code" x="381" y="638.5">js/store.js</text></g>
<g class="node plain"><rect class="box" x="365" y="678" width="645" height="46" rx="9"/><text class="title" x="687.5" y="707.0" text-anchor="middle">对话 · 检查器 · 耗时瀑布图 · 讲解模式</text></g>
<g class="node plain"><rect class="box" x="30" y="492" width="310" height="64" rx="9"/><rect class="bar" x="30" y="501" width="3.5" height="46" rx="1.75"/><text class="title" x="46" y="522.2">你的终端</text><text class="sub" x="46" y="540.2">加载动画、工具行、Markdown</text></g>
