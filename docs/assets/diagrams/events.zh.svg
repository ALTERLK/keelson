<rect class="label-bg" x="504.0" y="329.0" width="32.0" height="17" rx="4"/><text class="label brand" x="520.0" y="341.5" text-anchor="middle">订阅</text>
<rect class="label-bg" x="505.8" y="452.0" width="28.5" height="17" rx="4"/><text class="label plain" x="520.0" y="464.5" text-anchor="middle">SSE</text>
<rect class="label-bg" x="816.1" y="452.0" width="77.8" height="17" rx="4"/><text class="label plain" x="855.0" y="464.5" text-anchor="middle">trace.jsonl</text>
</svg>
