<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" role="img" aria-label="Keeping a long task inside the context window">
<title>Keeping a long task inside the context window</title>
<style>svg{--canvas:#ffffff;--frame:#d8dee4;--panel:#f6f8fa;--line:#d0d7de;--group:#afb8c1;--text:#1f2328;--muted:#59636e;--edge:#6e7781;--brand:#9a6700;--brand-bg:#fff8e6;--blue:#0969da;--blue-bg:#eef6ff;--ok:#1a7f37;--ok-bg:#eefbf1;--bad:#cf222e;--bad-bg:#fff1f0;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif}@media (prefers-color-scheme: dark){svg{--canvas:#0d1117;--frame:#30363d;--panel:#161b22;--line:#30363d;--group:#484f58;--text:#e6edf3;--muted:#9198a1;--edge:#7d8590;--brand:#f6c177;--brand-bg:#2a2113;--blue:#58a6ff;--blue-bg:#0f1e33;--ok:#3fb950;--ok-bg:#0f2417;--bad:#f85149;--bad-bg:#2d1214;}}.canvas{fill:var(--canvas);stroke:var(--frame)}.h1{font-size:19px;font-weight:650;fill:var(--text)}.h2{font-size:12.5px;fill:var(--muted)}.group{fill:none;stroke:var(--group);stroke-dasharray:4 4}.group-label{font-size:10.5px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}.box{fill:var(--panel);stroke:var(--line)}.bar{fill:var(--group)}.title{font-size:13.5px;font-weight:620;fill:var(--text)}.sub{font-size:11.5px;fill:var(--muted)}.code{font-size:10.5px;font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;fill:var(--muted)}.edge{fill:none;stroke:var(--edge);stroke-width:1.5}.edge.dashed{stroke-dasharray:5 4}.head{fill:var(--edge)}.label{font-size:11px;fill:var(--muted)}.label-bg{fill:var(--canvas)}.note{font-size:12px;fill:var(--muted)}.note-strong{font-size:12.5px;font-weight:620;fill:var(--text)}.track{fill:var(--panel);stroke:var(--line)}.fill-1{fill:var(--blue);opacity:.55}.fill-2{fill:var(--brand);opacity:.7}.fill-3{fill:var(--bad);opacity:.6}.tick{stroke:var(--text);stroke-width:1.5}.edge.brand{stroke:var(--brand)}.head.brand{fill:var(--brand)}.label.brand{fill:var(--brand)}.node.brand .bar{fill:var(--brand)}.node.brand .box{fill:var(--brand-bg);stroke:var(--brand)}.edge.blue{stroke:var(--blue)}.head.blue{fill:var(--blue)}.label.blue{fill:var(--blue)}.node.blue .bar{fill:var(--blue)}.node.blue .box{fill:var(--blue-bg);stroke:var(--blue)}.edge.ok{stroke:var(--ok)}.head.ok{fill:var(--ok)}.label.ok{fill:var(--ok)}.node.ok .bar{fill:var(--ok)}.node.ok .box{fill:var(--ok-bg);stroke:var(--ok)}.edge.bad{stroke:var(--bad)}.head.bad{fill:var(--bad)}.label.bad{fill:var(--bad)}.node.bad .bar{fill:var(--bad)}.node.bad .box{fill:var(--bad-bg);stroke:var(--bad)}</style>
<defs><marker id="head-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head plain" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="tail-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head plain" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="head-brand" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head brand" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="tail-brand" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head brand" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="head-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="tail-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="head-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="tail-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="head-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="tail-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0.8 L9,5 L0,9.2 z"/></marker></defs>
<rect class="canvas" x="0.5" y="0.5" width="1039" height="559" rx="14"/>
<text class="h1" x="30" y="42">Keeping a long task inside the context window</text>
<text class="h2" x="30" y="63">Three tiers, cheapest first. The first two cost nothing; only the last one calls a model.</text>
<path class="edge blue" d="M100.0,134.0 L100.0,172.0 Q100.0,180.0 108.0,180.0 L175.0,180.0 Q183.0,180.0 183.0,188.0 L183.0,214.0" marker-end="url(#head-blue)"/>
<path class="edge brand" d="M612.0,140.0 L612.0,172.0 Q612.0,180.0 604.0,180.0 L528.0,180.0 Q520.0,180.0 520.0,188.0 L520.0,214.0" marker-end="url(#head-brand)"/>
<path class="edge bad" d="M704.0,140.0 L704.0,188.0 Q704.0,196.0 712.0,196.0 L849.0,196.0 Q857.0,196.0 857.0,204.0 L857.0,214.0" marker-end="url(#head-bad)"/>
<path class="edge plain" d="M497.0,370.0 L497.0,410.0" marker-end="url(#head-plain)"/>
<path class="edge plain" d="M704.0,370.0 L704.0,410.0" marker-end="url(#head-plain)"/>
<path class="edge plain" d="M911.0,370.0 L911.0,410.0" marker-end="url(#head-plain)"/>
<rect class="track" x="60" y="112" width="920" height="22" rx="6"/><rect class="fill-1" x="60" y="112" width="552.0" height="22" rx="6"/><rect class="fill-2" x="612.0" y="112" width="92.0" height="22"/><rect class="fill-3" x="704.0" y="112" width="276.0" height="22" rx="6"/><line class="tick" x1="612.0" y1="106" x2="612.0" y2="140"/><line class="tick" x1="704.0" y1="106" x2="704.0" y2="140"/>
<text class="sub" x="60" y="100" text-anchor="start">context window in use</text>
<text class="label" x="612.0" y="100" text-anchor="middle">60%</text>
<text class="label" x="704.0" y="100" text-anchor="middle">70%</text>
<text class="label" x="980" y="100" text-anchor="end">100%</text>
<g class="node blue"><rect class="box" x="30" y="214" width="306" height="112" rx="9"/><rect class="bar" x="30" y="223" width="3.5" height="94" rx="1.75"/><text class="title" x="46" y="245.2">1 · Per-result budget</text><text class="sub" x="46" y="263.2">one oversized tool result is written</text><text class="sub" x="46" y="278.8">to disk; the model gets a preview</text><text class="sub" x="46" y="294.2">and a reference it can read later</text><text class="code" x="46" y="310.8">on every tool result</text></g>
<g class="node brand"><rect class="box" x="367" y="214" width="306" height="112" rx="9"/><rect class="bar" x="367" y="223" width="3.5" height="94" rx="1.75"/><text class="title" x="383" y="245.2">2 · Prune stale results</text><text class="sub" x="383" y="263.2">old tool results are trimmed;</text><text class="sub" x="383" y="278.8">the most recent ones stay intact</text><text class="sub" x="383" y="294.2">so the current step still has them</text><text class="code" x="383" y="310.8">at 60% of the window</text></g>
<g class="node bad"><rect class="box" x="704" y="214" width="306" height="112" rx="9"/><rect class="bar" x="704" y="223" width="3.5" height="94" rx="1.75"/><text class="title" x="720" y="245.2">3 · Fold</text><text class="sub" x="720" y="263.2">a side model rewrites the history</text><text class="sub" x="720" y="278.8">into three structured slices,</text><text class="sub" x="720" y="294.2">then the turn continues</text><text class="code" x="720" y="310.8">at 70% · emits context_fold</text></g>
<g class="node plain"><rect class="box" x="398" y="410" width="198" height="92" rx="9"/><rect class="bar" x="398" y="419" width="3.5" height="74" rx="1.75"/><text class="title" x="414" y="446.5">Episodic</text><text class="sub" x="414" y="464.5">what happened: the task,</text><text class="sub" x="414" y="480.0">key events, progress</text></g>
<g class="node plain"><rect class="box" x="605" y="410" width="198" height="92" rx="9"/><rect class="bar" x="605" y="419" width="3.5" height="74" rx="1.75"/><text class="title" x="621" y="446.5">Working</text><text class="sub" x="621" y="464.5">the goal right now</text><text class="sub" x="621" y="480.0">and the next actions</text></g>
<g class="node plain"><rect class="box" x="812" y="410" width="198" height="92" rx="9"/><rect class="bar" x="812" y="419" width="3.5" height="74" rx="1.75"/><text class="title" x="828" y="446.5">Tool</text><text class="sub" x="828" y="464.5">what worked, what failed,</text><text class="sub" x="828" y="480.0">so it is not retried blindly</text></g>
<path class="edge" d="M857.0,326 V370 M497.0,370 H911.0"/>
<text class="note-strong" x="30" y="424" text-anchor="start">Why three tiers?</text>
<text class="note" x="30" y="446" text-anchor="start">Folding loses detail and costs a model</text>
<text class="note" x="30" y="463" text-anchor="start">call, so it is the last resort. Most long</text>
<text class="note" x="30" y="480" text-anchor="start">runs are kept in bounds by the first</text>
<text class="note" x="30" y="497" text-anchor="start">two, which only touch tool output.</text>
</svg>
