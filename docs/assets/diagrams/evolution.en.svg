<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 690" width="1040" height="690" role="img" aria-label="How a skill changes">
<title>How a skill changes</title>
<style>svg{--canvas:#ffffff;--frame:#d8dee4;--panel:#f6f8fa;--line:#d0d7de;--group:#afb8c1;--text:#1f2328;--muted:#59636e;--edge:#6e7781;--brand:#9a6700;--brand-bg:#fff8e6;--blue:#0969da;--blue-bg:#eef6ff;--ok:#1a7f37;--ok-bg:#eefbf1;--bad:#cf222e;--bad-bg:#fff1f0;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif}@media (prefers-color-scheme: dark){svg{--canvas:#0d1117;--frame:#30363d;--panel:#161b22;--line:#30363d;--group:#484f58;--text:#e6edf3;--muted:#9198a1;--edge:#7d8590;--brand:#f6c177;--brand-bg:#2a2113;--blue:#58a6ff;--blue-bg:#0f1e33;--ok:#3fb950;--ok-bg:#0f2417;--bad:#f85149;--bad-bg:#2d1214;}}.canvas{fill:var(--canvas);stroke:var(--frame)}.h1{font-size:19px;font-weight:650;fill:var(--text)}.h2{font-size:12.5px;fill:var(--muted)}.group{fill:none;stroke:var(--group);stroke-dasharray:4 4}.group-label{font-size:10.5px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}.box{fill:var(--panel);stroke:var(--line)}.bar{fill:var(--group)}.title{font-size:13.5px;font-weight:620;fill:var(--text)}.sub{font-size:11.5px;fill:var(--muted)}.code{font-size:10.5px;font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;fill:var(--muted)}.edge{fill:none;stroke:var(--edge);stroke-width:1.5}.edge.dashed{stroke-dasharray:5 4}.head{fill:var(--edge)}.label{font-size:11px;fill:var(--muted)}.label-bg{fill:var(--canvas)}.note{font-size:12px;fill:var(--muted)}.note-strong{font-size:12.5px;font-weight:620;fill:var(--text)}.track{fill:var(--panel);stroke:var(--line)}.fill-1{fill:var(--blue);opacity:.55}.fill-2{fill:var(--brand);opacity:.7}.fill-3{fill:var(--bad);opacity:.6}.tick{stroke:var(--text);stroke-width:1.5}.edge.brand{stroke:var(--brand)}.head.brand{fill:var(--brand)}.label.brand{fill:var(--brand)}.node.brand .bar{fill:var(--brand)}.node.brand .box{fill:var(--brand-bg);stroke:var(--brand)}.edge.blue{stroke:var(--blue)}.head.blue{fill:var(--blue)}.label.blue{fill:var(--blue)}.node.blue .bar{fill:var(--blue)}.node.blue .box{fill:var(--blue-bg);stroke:var(--blue)}.edge.ok{stroke:var(--ok)}.head.ok{fill:var(--ok)}.label.ok{fill:var(--ok)}.node.ok .bar{fill:var(--ok)}.node.ok .box{fill:var(--ok-bg);stroke:var(--ok)}.edge.bad{stroke:var(--bad)}.head.bad{fill:var(--bad)}.label.bad{fill:var(--bad)}.node.bad .bar{fill:var(--bad)}.node.bad .box{fill:var(--bad-bg);stroke:var(--bad)}</style>
<defs><marker id="head-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head plain" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="tail-plain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head plain" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="head-brand" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head brand" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="tail-brand" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head brand" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="head-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="tail-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head blue" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="head-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="tail-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head ok" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="head-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0.8 L9,5 L0,9.2 z"/></marker><marker id="tail-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head bad" d="M0,0.8 L9,5 L0,9.2 z"/></marker></defs>
<rect class="canvas" x="0.5" y="0.5" width="1039" height="689" rx="14"/>
<text class="h1" x="30" y="42">How a skill changes</text>
<text class="h2" x="30" y="63">The evidence is the user&#x27;s next message, never the model grading itself. An update must not be worse than what it replaces.</text>
<path class="edge plain" d="M210.0,143.0 L230.0,143.0" marker-end="url(#head-plain)"/>
<path class="edge plain" d="M410.0,143.0 L430.0,143.0" marker-end="url(#head-plain)"/>
<path class="edge plain" d="M610.0,143.0 L630.0,143.0" marker-end="url(#head-plain)"/>
<path class="edge plain" d="M810.0,143.0 L830.0,143.0" marker-end="url(#head-plain)"/>
<path class="edge brand" d="M884.0,186.0 L884.0,218.0 Q884.0,226.0 876.0,226.0 L642.0,226.0 Q634.0,226.0 634.0,234.0 L634.0,262.0" marker-end="url(#head-brand)"/>
<path class="edge ok" d="M959.6,186.0 L959.6,262.0" marker-end="url(#head-ok)"/>
<path class="edge ok" d="M440.0,358.0 L440.0,430.0" marker-end="url(#head-ok)"/>
<path class="edge bad" d="M620.0,358.0 L620.0,430.0" marker-end="url(#head-bad)"/>
<path class="edge plain" d="M385.0,526.0 L385.0,590.0" marker-end="url(#head-plain)"/>
<path class="edge plain dashed" d="M685.0,526.0 L685.0,590.0" marker-end="url(#head-plain)"/>
<path class="edge plain" d="M920.0,358.0 L920.0,613.0 Q920.0,621.0 912.0,621.0 L820.0,621.0" marker-end="url(#head-plain)"/>
<path class="edge blue" d="M250.0,621.0 L68.0,621.0 Q60.0,621.0 60.0,613.0 L60.0,186.0" marker-end="url(#head-blue)"/>
<g class="node blue"><rect class="box" x="30" y="100" width="180" height="86" rx="9"/><rect class="bar" x="30" y="109" width="3.5" height="68" rx="1.75"/><text class="title" x="46" y="133.5">Turn N</text><text class="sub" x="46" y="151.5">task → answer;</text><text class="sub" x="46" y="167.0">remember the exchange</text></g>
<g class="node blue"><rect class="box" x="230" y="100" width="180" height="86" rx="9"/><rect class="bar" x="230" y="109" width="3.5" height="68" rx="1.75"/><text class="title" x="246" y="133.5">Turn N+1</text><text class="sub" x="246" y="151.5">the user reacts:</text><text class="sub" x="246" y="167.0">“from now on, always…”</text></g>
<g class="node plain"><rect class="box" x="430" y="100" width="180" height="86" rx="9"/><rect class="bar" x="430" y="109" width="3.5" height="68" rx="1.75"/><text class="title" x="446" y="126.0">Pre-gate</text><text class="sub" x="446" y="144.0">does it read as durable</text><text class="sub" x="446" y="159.5">feedback? (no model call)</text><text class="code" x="446" y="176.0">skill_gating.py</text></g>
<g class="node brand"><rect class="box" x="630" y="100" width="180" height="86" rx="9"/><rect class="bar" x="630" y="109" width="3.5" height="68" rx="1.75"/><text class="title" x="646" y="126.0">Extractor</text><text class="sub" x="646" y="144.0">one candidate rule,</text><text class="sub" x="646" y="159.5">from the user&#x27;s words</text><text class="code" x="646" y="176.0">side model</text></g>
<g class="node brand"><rect class="box" x="830" y="100" width="180" height="86" rx="9"/><rect class="bar" x="830" y="109" width="3.5" height="68" rx="1.75"/><text class="title" x="846" y="126.0">Maintainer</text><text class="sub" x="846" y="144.0">add · merge · discard</text><text class="sub" x="846" y="159.5">against existing skills</text><text class="code" x="846" y="176.0">side model</text></g>
<g class="node brand"><rect class="box" x="330" y="262" width="380" height="96" rx="9"/><rect class="bar" x="330" y="271" width="3.5" height="78" rx="1.75"/><text class="title" x="346" y="293.0">Non-inferiority gate</text><text class="sub" x="346" y="311.0">replay the skill&#x27;s own past cases on old and new;</text><text class="sub" x="346" y="326.5">hard failures must not rise, pass rate must not fall</text><text class="code" x="346" y="343.0">skill_gate.py</text></g>
<g class="node ok"><rect class="box" x="830" y="262" width="180" height="96" rx="9"/><rect class="bar" x="830" y="271" width="3.5" height="78" rx="1.75"/><text class="title" x="846" y="300.5">New skill</text><text class="sub" x="846" y="318.5">nothing to compare</text><text class="sub" x="846" y="334.0">with yet: written as v1</text></g>
<g class="node ok"><rect class="box" x="250" y="430" width="270" height="96" rx="9"/><rect class="bar" x="250" y="439" width="3.5" height="78" rx="1.75"/><text class="title" x="266" y="461.0">Admit</text><text class="sub" x="266" y="479.0">write SKILL.md vN+1, snapshot vN,</text><text class="sub" x="266" y="494.5">write an Evolution Card</text><text class="code" x="266" y="511.0">skill_history.py</text></g>
<g class="node bad"><rect class="box" x="550" y="430" width="270" height="96" rx="9"/><rect class="bar" x="550" y="439" width="3.5" height="78" rx="1.75"/><text class="title" x="566" y="461.0">Quarantine</text><text class="sub" x="566" y="479.0">candidate set aside, live file</text><text class="sub" x="566" y="494.5">restored, card still written</text><text class="code" x="566" y="511.0">evolution_card.py</text></g>
<g class="node plain"><rect class="box" x="250" y="590" width="570" height="62" rx="9"/><rect class="bar" x="250" y="599" width="3.5" height="44" rx="1.75"/><text class="title" x="266" y="611.8">Skill store</text><text class="sub" x="266" y="629.8">SKILL.md · history/ · cards/ · quarantine/</text><text class="code" x="266" y="646.2">.keelson/skills/&lt;name&gt;/</text></g>
<text class="note-strong" x="84" y="286" text-anchor="start">Why a gate?</text>
<text class="note" x="84" y="308" text-anchor="start">A rule distilled from one</text>
<text class="note" x="84" y="325" text-anchor="start">conversation can quietly break</text>
<text class="note" x="84" y="342" text-anchor="start">what an older version got right.</text>
<text class="note" x="84" y="359" text-anchor="start">The gate makes that visible</text>
<text class="note" x="84" y="376" text-anchor="start">before the file is replaced.</text>
<rect class="label-bg" x="740.6" y="217.0" width="40.8" height="17" rx="4"/><text class="label brand" x="761.0" y="229.5" text-anchor="middle">merge</text>
<rect class="label-bg" x="945.4" y="215.0" width="28.5" height="17" rx="4"/><text class="label ok" x="959.6" y="227.5" text-anchor="middle">add</text>
<rect class="label-bg" x="422.7" y="385.0" width="34.6" height="17" rx="4"/><text class="label ok" x="440.0" y="397.5" text-anchor="middle">pass</text>
<rect class="label-bg" x="602.7" y="385.0" width="34.6" height="17" rx="4"/><text class="label bad" x="620.0" y="397.5" text-anchor="middle">fail</text>
<rect class="label-bg" x="51.2" y="552.0" width="225.6" height="17" rx="4"/><text class="label blue" x="164.0" y="564.5" text-anchor="middle">retrieved on the next matching task</text>
</svg>
