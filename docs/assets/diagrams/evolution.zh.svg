<path class="edge blue" d="M250.0,621.0 L68.0,621.0 Q60.0,621.0 60.0,613.0 L60.0,186.0" marker-end="url(#head-blue)"/>
<g class="node blue"><rect class="box" x="30" y="100" width="180" height="86" rx="9"/><rect class="bar" x="30" y="109" width="3.5" height="68" rx="1.75"/><text class="title" x="46" y="133.5">第 N 轮</text><text class="sub" x="46" y="151.5">任务 → 回答；</text><text class="sub" x="46" y="167.0">记下这次交互</text></g>
<g class="node blue"><rect class="box" x="230" y="100" width="180" height="86" rx="9"/><rect class="bar" x="230" y="109" width="3.5" height="68" rx="1.75"/><text class="title" x="246" y="133.5">第 N+1 轮</text><text class="sub" x="246" y="151.5">用户给出反馈：</text><text class="sub" x="246" y="167.0">“以后都……”</text></g>
<g class="node plain"><rect class="box" x="430" y="100" width="180" height="86" rx="9"/><rect class="bar" x="430" y="109" width="3.5" height="68" rx="1.75"/><text class="title" x="446" y="126.0">预筛</text><text class="sub" x="446" y="144.0">像长期有效的反馈吗？</text><text class="sub" x="446" y="159.5">（不调用模型）</text><text class="code" x="446" y="176.0">skill_gating.py</text></g>
<g class="node brand"><rect class="box" x="630" y="100" width="180" height="86" rx="9"/><rect class="bar" x="630" y="109" width="3.5" height="68" rx="1.75"/><text class="title" x="646" y="126.0">提取器</text><text class="sub" x="646" y="144.0">从用户原话里</text><text class="sub" x="646" y="159.5">提取一条候选规则</text><text class="code" x="646" y="176.0">side model</text></g>
<g class="node brand"><rect class="box" x="830" y="100" width="180" height="86" rx="9"/><rect class="bar" x="830" y="109" width="3.5" height="68" rx="1.75"/><text class="title" x="846" y="126.0">维护者</text><text class="sub" x="846" y="144.0">新增 · 合并 · 丢弃</text><text class="sub" x="846" y="159.5">对照已有技能决定</text><text class="code" x="846" y="176.0">side model</text></g>
<g class="node brand"><rect class="box" x="330" y="262" width="380" height="96" rx="9"/><rect class="bar" x="330" y="271" width="3.5" height="78" rx="1.75"/><text class="title" x="346" y="293.0">非劣门禁</text><text class="sub" x="346" y="311.0">用该技能自己的历史用例重放新旧两版；</text><text class="sub" x="346" y="326.5">硬失败不能变多，通过率不能下降</text><text class="code" x="346" y="343.0">skill_gate.py</text></g>
<g class="node ok"><rect class="box" x="830" y="262" width="180" height="96" rx="9"/><rect class="bar" x="830" y="271" width="3.5" height="78" rx="1.75"/><text class="title" x="846" y="300.5">新增技能</text><text class="sub" x="846" y="318.5">没有旧版本可比：</text><text class="sub" x="846" y="334.0">直接写成 v1</text></g>
<g class="node ok"><rect class="box" x="250" y="430" width="270" height="96" rx="9"/><rect class="bar" x="250" y="439" width="3.5" height="78" rx="1.75"/><text class="title" x="266" y="461.0">采纳</text><text class="sub" x="266" y="479.0">写入 SKILL.md vN+1，快照 vN，</text><text class="sub" x="266" y="494.5">生成进化卡片</text><text class="code" x="266" y="511.0">skill_history.py</text></g>
<g class="node bad"><rect class="box" x="550" y="430" width="270" height="96" rx="9"/><rect class="bar" x="550" y="439" width="3.5" height="78" rx="1.75"/><text class="title" x="566" y="461.0">隔离</text><text class="sub" x="566" y="479.0">候选被搁置，线上文件恢复，</text><text class="sub" x="566" y="494.5">卡片照样生成</text><text class="code" x="566" y="511.0">evolution_card.py</text></g>
<g class="node plain"><rect class="box" x="250" y="590" width="570" height="62" rx="9"/><rect class="bar" x="250" y="599" width="3.5" height="44" rx="1.75"/><text class="title" x="266" y="611.8">技能库</text><text class="sub" x="266" y="629.8">SKILL.md · history/ · cards/ · quarantine/</text><text class="code" x="266" y="646.2">.keelson/skills/&lt;name&gt;/</text></g>
<text class="note-strong" x="84" y="286" text-anchor="start">为什么要有门禁？</text>
<text class="note" x="84" y="308" text-anchor="start">从一次对话里提炼出的规则，</text>
<text class="note" x="84" y="325" text-anchor="start">可能悄悄破坏旧版本原本</text>
<text class="note" x="84" y="342" text-anchor="start">做对的事。门禁让这种</text>
<text class="note" x="84" y="359" text-anchor="start">退步在文件被替换之前</text>
<text class="note" x="84" y="376" text-anchor="start">就暴露出来。</text>
<rect class="label-bg" x="745.0" y="217.0" width="32.0" height="17" rx="4"/><text class="label brand" x="761.0" y="229.5" text-anchor="middle">合并</text>
<rect class="label-bg" x="943.6" y="215.0" width="32.0" height="17" rx="4"/><text class="label ok" x="959.6" y="227.5" text-anchor="middle">新增</text>
<rect class="label-bg" x="424.0" y="385.0" width="32.0" height="17" rx="4"/><text class="label ok" x="440.0" y="397.5" text-anchor="middle">通过</text>
<rect class="label-bg" x="598.5" y="385.0" width="43.0" height="17" rx="4"/><text class="label bad" x="620.0" y="397.5" text-anchor="middle">未通过</text>
<rect class="label-bg" x="82.0" y="552.0" width="164.0" height="17" rx="4"/><text class="label blue" x="164.0" y="564.5" text-anchor="middle">下次遇到同类任务时被检索出来</text>
</svg>
