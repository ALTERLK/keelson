<g class="mark" transform="translate(44,40) scale(2.1)"><path d="M16 4v24"/><path d="M16 9c-5 1-8 4-9 9"/><path d="M16 9c5 1 8 4 9 9"/><path d="M16 17c-3 .6-5 2.4-6 5.5"/><path d="M16 17c3 .6 5 2.4 6 5.5"/></g>
<text class="name" x="122" y="92">Keelson</text>
<text class="tag" x="48" y="146">The model proposes. The runtime decides, executes and records.</text>
<text class="lead" x="48" y="172">A self-evolving agent harness in Python, with no agent framework underneath.</text>
