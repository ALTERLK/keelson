<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 250" width="1040" height="250" role="img" aria-label="Keelson">
<title>Keelson — The model proposes. The runtime decides, executes and records.</title>
<style>svg{--canvas:#ffffff;--frame:#d8dee4;--panel:#f6f8fa;--line:#d0d7de;--group:#afb8c1;--text:#1f2328;--muted:#59636e;--edge:#6e7781;--brand:#9a6700;--brand-bg:#fff8e6;--blue:#0969da;--blue-bg:#eef6ff;--ok:#1a7f37;--ok-bg:#eefbf1;--bad:#cf222e;--bad-bg:#fff1f0;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif}@media (prefers-color-scheme: dark){svg{--canvas:#0d1117;--frame:#30363d;--panel:#161b22;--line:#30363d;--group:#484f58;--text:#e6edf3;--muted:#9198a1;--edge:#7d8590;--brand:#f6c177;--brand-bg:#2a2113;--blue:#58a6ff;--blue-bg:#0f1e33;--ok:#3fb950;--ok-bg:#0f2417;--bad:#f85149;--bad-bg:#2d1214;}}.canvas{fill:var(--canvas);stroke:var(--frame)}.h1{font-size:19px;font-weight:650;fill:var(--text)}.h2{font-size:12.5px;fill:var(--muted)}.group{fill:none;stroke:var(--group);stroke-dasharray:4 4}.group-label{font-size:10.5px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}.box{fill:var(--panel);stroke:var(--line)}.bar{fill:var(--group)}.title{font-size:13.5px;font-weight:620;fill:var(--text)}.sub{font-size:11.5px;fill:var(--muted)}.code{font-size:10.5px;font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;fill:var(--muted)}.edge{fill:none;stroke:var(--edge);stroke-width:1.5}.edge.dashed{stroke-dasharray:5 4}.head{fill:var(--edge)}.label{font-size:11px;fill:var(--muted)}.label-bg{fill:var(--canvas)}.note{font-size:12px;fill:var(--muted)}.note-strong{font-size:12.5px;font-weight:620;fill:var(--text)}.track{fill:var(--panel);stroke:var(--line)}.fill-1{fill:var(--blue);opacity:.55}.fill-2{fill:var(--brand);opacity:.7}.fill-3{fill:var(--bad);opacity:.6}.tick{stroke:var(--text);stroke-width:1.5}.edge.brand{stroke:var(--brand)}.head.brand{fill:var(--brand)}.label.brand{fill:var(--brand)}.node.brand .bar{fill:var(--brand)}.node.brand .box{fill:var(--brand-bg);stroke:var(--brand)}.edge.blue{stroke:var(--blue)}.head.blue{fill:var(--blue)}.label.blue{fill:var(--blue)}.node.blue .bar{fill:var(--blue)}.node.blue .box{fill:var(--blue-bg);stroke:var(--blue)}.edge.ok{stroke:var(--ok)}.head.ok{fill:var(--ok)}.label.ok{fill:var(--ok)}.node.ok .bar{fill:var(--ok)}.node.ok .box{fill:var(--ok-bg);stroke:var(--ok)}.edge.bad{stroke:var(--bad)}.head.bad{fill:var(--bad)}.label.bad{fill:var(--bad)}.node.bad .bar{fill:var(--bad)}.node.bad .box{fill:var(--bad-bg);stroke:var(--bad)}.name{font-size:50px;font-weight:720;letter-spacing:-.02em;fill:var(--text)}.tag{font-size:18px;font-weight:560;fill:var(--text)}.lead{font-size:13.5px;fill:var(--muted)}.mark{fill:none;stroke:var(--brand);stroke-width:2.2;stroke-linecap:round}.pill{fill:var(--panel);stroke:var(--line)}.pill-text{font-size:11.5px;fill:var(--muted)}.ring{fill:none;stroke:var(--line);stroke-width:1.5}.ring-flow{fill:none;stroke:var(--brand);stroke-width:1.8;stroke-dasharray:2 11;stroke-linecap:round}.dot{fill:var(--canvas);stroke:var(--group);stroke-width:1.8}.dot.on{fill:var(--brand);stroke:var(--brand)}.stage{font-size:11.5px;fill:var(--muted)}.stage.on{fill:var(--text);font-weight:620}</style>
