<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- "live" when served by `keelson web`; scripts/build_pages.py rewrites it to
       "static" for the hosted demo, where there is no server behind the page. -->
  <meta name="keelson-mode" content="live">
  <title>Keelson Console</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint so the page never flashes.
    try {
      var saved = localStorage.getItem("keelson-theme");
      if (saved) document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <a class="brand" href="#/console" aria-label="Keelson">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 4v24" />
          <path d="M16 9c-5 1-8 4-9 9" />
          <path d="M16 9c5 1 8 4 9 9" />
          <path d="M16 17c-3 .6-5 2.4-6 5.5" />
          <path d="M16 17c3 .6 5 2.4 6 5.5" />
        </svg>
        <span class="brand-name">Keelson</span>
      </a>

      <nav class="nav" id="nav">
        <a href="#/console" data-route="console">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4h11A1.5 1.5 0 0 1 17 5.5v7a1.5 1.5 0 0 1-1.5 1.5H9l-4 3v-3h-.5A1.5 1.5 0 0 1 3 12.5z"/></svg>
          <span data-i18n="nav.console"></span>
        </a>
        <a href="#/skills" data-route="skills">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3l6 3.5v7L10 17l-6-3.5v-7z"/><path d="M10 10l6-3.5M10 10v7M10 10L4 6.5"/></svg>
          <span data-i18n="nav.skills"></span>
        </a>
        <a href="#/bench" data-route="bench">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16V9M10 16V4M16 16v-5"/></svg>
          <span data-i18n="nav.bench"></span>
        </a>
        <a href="#/traces" data-route="traces">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M8.5 7.2v5.6l4.4-2.8z"/></svg>
          <span data-i18n="nav.traces"></span>
        </a>
      </nav>

      <div class="rail-foot">
        <div class="status" id="status"><span class="status-dot"></span><span id="status-text"></span></div>
        <div class="rail-actions">
          <button class="ghost" id="lang-toggle" type="button" title="Language / 语言"></button>
          <button class="ghost" id="theme-toggle" type="button" title="Theme">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 12.5A6.5 6.5 0 0 1 7.5 4.5a6.5 6.5 0 1 0 8 8z"/></svg>
          </button>
          <a class="ghost" href="https://github.com/ALTERLK/keelson" target="_blank" rel="noopener" title="GitHub">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 16.5c-3.5 1-3.5-2-5-2.5m10 4v-2.8a2.4 2.4 0 0 0-.7-1.9c2.300-.3 4.700-1.100 4.700-5.100a4 4 0 0 0-1.100-2.700 3.700 3.700 0 0 0-.1-2.700s-.9-.300-2.900 1.100a10 10 0 0 0-5.200 0C5.200 2.500 4.300 2.800 4.300 2.800a3.700 3.700 0 0 0-.1 2.700A4 4 0 0 0 3 8.200c0 4 2.400 4.800 4.700 5.100a2.400 2.400 0 0 0-.7 1.900v2.800"/></svg>
          </a>
        </div>
      </div>
    </aside>

    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <div id="modal-root"></div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
