<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- "live" when served by `keelson web`; scripts/build_pages.py rewrites it to
       "static" for the hosted demo, where there is no server behind the page. -->
  <meta name="keelson-mode" content="live">
  <meta name="description" content="Keelson — a self-evolving agent harness. The model proposes; the runtime checks, executes and records.">
  <title>Keelson</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint so the page never flashes.
    try {
      var saved = localStorage.getItem("keelson-theme");
      if (saved) document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <a class="brand" href="#/" aria-label="Keelson">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 4v24" />
          <path d="M16 9c-5 1-8 4-9 9" />
          <path d="M16 9c5 1 8 4 9 9" />
          <path d="M16 17c-3 .6-5 2.4-6 5.5" />
          <path d="M16 17c3 .6 5 2.4 6 5.5" />
        </svg>
        <span class="brand-name">Keelson</span>
        <span class="brand-version" id="version"></span>
      </a>

      <button class="palette-trigger" id="palette-trigger" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13.5 13.5L17 17"/></svg>
        <span data-i18n="palette.open"></span>
        <kbd>Ctrl K</kbd>
      </button>

      <nav class="nav" id="nav">
        <a href="#/" data-route="home">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.500 9.500L10 4l6.500 5.500V16h-4.500v-4h-4v4H3.500z"/></svg>
          <span data-i18n="nav.home"></span>
        </a>
        <a href="#/console" data-route="console">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5A1.500 1.500 0 0 1 4.500 4h11A1.500 1.500 0 0 1 17 5.500v7a1.500 1.500 0 0 1-1.500 1.500H9l-4 3v-3h-.500A1.500 1.500 0 0 1 3 12.500z"/></svg>
          <span data-i18n="nav.console"></span>
        </a>
        <a href="#/cases" data-route="cases">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4h6l1 3h2.500v9h-13V7H6z"/><path d="M8 11l1.500 1.500L12.500 9.500"/></svg>
          <span data-i18n="nav.cases"></span>
        </a>
        <a href="#/skills" data-route="skills">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3l6 3.500v7L10 17l-6-3.500v-7z"/><path d="M10 10l6-3.500M10 10v7M10 10L4 6.500"/></svg>
          <span data-i18n="nav.skills"></span>
        </a>
        <a href="#/bench" data-route="bench">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16V9M10 16V4M16 16v-5"/></svg>
          <span data-i18n="nav.bench"></span>
        </a>
        <a href="#/traces" data-route="traces">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M8.500 7.200v5.600l4.400-2.800z"/></svg>
          <span data-i18n="nav.traces"></span>
        </a>
      </nav>

      <div class="sessions" id="sessions"></div>

      <div class="rail-foot">
        <div class="status" id="status"><span class="status-dot"></span><span id="status-text"></span></div>
        <div class="rail-actions">
          <button class="ghost" id="lang-toggle" type="button" title="Language / 语言"></button>
          <button class="ghost" id="theme-toggle" type="button" title="Theme">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.500 12.500A6.500 6.500 0 0 1 7.500 4.500a6.500 6.500 0 1 0 8 8z"/></svg>
          </button>
          <a class="ghost" href="https://github.com/ALTERLK/keelson" target="_blank" rel="noopener" title="GitHub">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.500 16.500c-3.500 1-3.500-2-5-2.500m10 4v-2.800a2.400 2.400 0 0 0-.7-1.900c2.300-.3 4.700-1.100 4.700-5.100a4 4 0 0 0-1.100-2.700 3.700 3.700 0 0 0-.1-2.700s-.9-.3-2.900 1.100a10 10 0 0 0-5.200 0C5.200 2.500 4.300 2.800 4.300 2.800a3.700 3.700 0 0 0-.1 2.700A4 4 0 0 0 3 8.200c0 4 2.400 4.800 4.700 5.100a2.400 2.400 0 0 0-.7 1.900v2.800"/></svg>
          </a>
        </div>
      </div>
    </aside>

    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <div id="modal-root"></div>
  <div id="palette-root"></div>
  <div class="toasts" id="toast-root" aria-live="polite"></div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
