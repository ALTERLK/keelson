[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "keelson"
version = "0.3.0"
description = "A self-evolving agent harness: permission-gated tool execution, context folding, long-term memory, and skills that only change when a non-inferiority gate lets them."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lk" }]
keywords = ["agent", "llm", "tool-calling", "mcp", "benchmark"]
dependencies = [
    "anthropic>=0.25",
    "openai>=1.0",
    "prompt_toolkit>=3.0.43",  # the REPL's input line: history, completion, Shift+Tab
    "python-dotenv>=1.0",
    "rich>=13.0",
    "send2trash>=1.8",      # delete_files moves things to the Recycle Bin / Trash
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "httpx>=0.27",          # FastAPI's TestClient
]
# The browser console (`keelson web`). Optional: the CLI runs without it.
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# The desktop app (`keelson desktop`): the console in its own window (WebView2 on Windows).
desktop = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pywebview>=5.0",
]
# Builds Keelson.exe / keelson-cli.exe (scripts/build_desktop.py).
build = [
    "pyinstaller>=6.0",
]
# Third-party libs a subset of ToolHop tool bodies import.
bench = [
    "python-dateutil>=2.8",
    "pytz>=2024.1",
    "babel>=2.14",
    "dicttoxml>=1.7",
]

[project.urls]
Repository = "https://github.com/ALTERLK/keelson"
Demo = "https://alterlk.github.io/keelson/"

[project.scripts]
keelson = "keelson.main:main"

[tool.setuptools]
packages = ["keelson", "keelson.bench", "keelson.web"]

[tool.setuptools.package-data]
"keelson.web" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Vendored third-party skill payloads are not part of the harness.
extend-exclude = [".keelson/skills/*/scripts", "bench/tasks", "_private"]

[tool.ruff.lint]
# A deliberately small rule set: correctness and import hygiene, no style churn.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # long lines (line-length above is a soft target)
    "B008",   # function call in arg default — used intentionally
    "E741",   # ambiguous var name (`l` for line)
    "E722",   # bare except in tool wrappers, where any failure becomes a tool error string
    "B023",   # loop-var closure (used with immediate gather)
    "E402",   # import-not-at-top (one deliberate late import)
]
